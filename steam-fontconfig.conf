<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Native Termux launch: use real paths, not Linux /usr paths. -->
  <dir>/data/data/com.termux/files/usr/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family><family>Droid Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Serif</family><family>Droid Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
